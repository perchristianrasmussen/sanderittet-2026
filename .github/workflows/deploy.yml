name: Deploy via FTP

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # lar deg kjøre manuelt også

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout kode
      uses: actions/checkout@v4

    - name: Deploy til FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftps
        port: 21
        local-dir: ./
        server-dir: /www/
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/.github/**
          README.md